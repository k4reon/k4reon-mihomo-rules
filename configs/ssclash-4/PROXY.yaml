# =======================
# RULES
# =======================
# Порядок:
#  1. private → DIRECT
#  2. ads → REJECT (до RU, иначе .ru перебьёт блокировку)
#  3. custom-proxy → PROXY (до RU, иначе DOMAIN-SUFFIX,ru перебьёт)
#  4. ru → DIRECT
#  5. torrent → DIRECT
#  6. youtube → YouTube
#  7. games → Games (IP только для UDP)
#  8. discord → Discord
#  9. ai → Ai (до Google!)
# 10. google → DIRECT (поиск с российским IP)
# 11. messengers → Messengers
# 12. social → Fast
# 13. custom-direct → DIRECT
# 14. GEOIP RU/SU → DIRECT
# 15. MATCH → PROXY
rules:
  # no-resolve — не резолвить домен ради IP-правила: быстрее и меньше DNS-запросов
  # --- Локальные сети ---
  - RULE-SET,k4reon-private-domains,DIRECT
  - RULE-SET,k4reon-private-ip,DIRECT,no-resolve

  # --- Реклама ---
  - RULE-SET,k4reon-ads-domains,REJECT

  # --- Исключения устройств (примеры: раскомментировать и указать свои IP) ---
  # SRC-IP-CIDR — трафик ОТ устройства, IP-CIDR — трафик К устройству.
  # Стоят после рекламы, но до сервисных правил, иначе YouTube/Discord/AI
  # перехватят трафик этого устройства.
  # Это исключение из ПРОКСИРОВАНИЯ: DNS и блокировка рекламы mihomo работают.
  # В SSClash 4 отдельного BYPASS_SOURCES нет: эти правила убирают проксирование,
  # а полный обход (tproxy + DNS) настраивается вручную через firewall.
  #- SRC-IP-CIDR,IP устройства/32,DIRECT # от устройства
  #- IP-CIDR,IP устройства/32,DIRECT # к устройству

  # Custom override: must be before RU rules, otherwise DOMAIN-SUFFIX,ru wins
  - RULE-SET,k4reon-custom-proxy,PROXY

  # --- RU напрямую ---
  - RULE-SET,k4reon-ru-domains,DIRECT
  - RULE-SET,k4reon-ru-classical,DIRECT

  # --- Торренты ---
  - RULE-SET,k4reon-torrent-domains,DIRECT

  # --- YouTube ---
  - RULE-SET,k4reon-youtube-domains,YouTube
  - RULE-SET,k4reon-youtube-ip,YouTube,no-resolve

  # --- Игры ---
  - RULE-SET,k4reon-games-domains,Games
  # IP-набор игр — только для UDP, чтобы не завернуть сюда их TCP-трафик
  - AND,((NETWORK,UDP),(RULE-SET,k4reon-games-ip)),Games
  - RULE-SET,k4reon-games-ports,Games

  # --- Discord ---
  - RULE-SET,k4reon-discord-domains,Discord
  - RULE-SET,k4reon-discord-ip,Discord,no-resolve
  - RULE-SET,k4reon-discord-ports,Discord

  # --- AI / Gemini / нейросети (до Google) ---
  - RULE-SET,k4reon-ai-domains,Ai
  - RULE-SET,k4reon-ai-ip,Ai,no-resolve

  # --- Google поиск/сервисы (российский IP) ---
  - RULE-SET,k4reon-google-domains,DIRECT
  - RULE-SET,k4reon-google-ip,DIRECT,no-resolve

  # --- Мессенджеры ---
  - RULE-SET,k4reon-messengers-domains,Messengers
  - RULE-SET,k4reon-messengers-ip,Messengers,no-resolve

  # --- Соцсети ---
  - RULE-SET,k4reon-social-domains,Fast
  - RULE-SET,k4reon-social-ip,Fast,no-resolve

  # --- Кастомные домены ---
  - RULE-SET,k4reon-custom-direct,DIRECT

  # --- Россия по IP ---
  - GEOIP,RU,DIRECT
  - GEOIP,SU,DIRECT

  # --- Всё остальное ---
  - MATCH,PROXY
