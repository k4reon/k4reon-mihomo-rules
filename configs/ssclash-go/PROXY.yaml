# ============================================================
#  mihomo / SSClash-Go — профиль PROXY (MATCH,PROXY)
#
#  За основу конфигурации взят материал:
#  https://ssclash.notion.site/Mihomo-SSClash-15989188f6b48051a97fc887adea736a
#  Полный конфиг для домашнего роутера в России (tproxy).
#
#  Логика: всё, что не совпало с правилами, идёт в PROXY.
#  Поэтому ниже перечислены все исключения: RU, private,
#  torrents, реклама, сервисы и игры.
#
#  Перед использованием:
#    - заменить url подписки в proxy-providers.main;
#    - при необходимости раскомментировать фильтры групп.
# ============================================================

mode: rule
tproxy-port: 7894
udp: true
# Full-cone NAT: одно отображение на порт клиента.
# Даёт открытый NAT в играх; P2P-потоки переиспользуют mapping.
endpoint-independent-nat: true
ipv6: false
log-level: info
allow-lan: false

geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geoip.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geosite.dat"

profile:
  store-selected: true

experimental:
  connection-pool: true
  udp-fallback-match: true

udp-timeout: 300
routing-mark: 2

unified-delay: true
tcp-concurrent: true

keep-alive-idle: 600
keep-alive-interval: 30
disable-keep-alive: false

# SSClash-Go: API только на localhost.
external-controller: 127.0.0.1:9090

# =======================
# DNS
# =======================
# Обычные запросы — DoH через Fast.
# .lan/.local и российские сервисы — системный/DNS Яндекса.
# AI — отдельный DoH через группу Ai.
dns:
  enable: true
  listen: 127.0.0.1:7874
  ipv6: false

  cache-algorithm: arc
  respect-rules: false

  default-nameserver:
    - 9.9.9.9
    - 1.1.1.1

  proxy-server-nameserver:
    - 77.88.8.8
    - 8.8.8.8

  nameserver:
    - 'https://dns.quad9.net/dns-query#Fast'
    - 'https://1.1.1.1/dns-query#Fast'

  nameserver-policy:
    '+.lan': system
    '+.local': system
    "+.kion.ru": system
    "+.wink.ru": system
    'geosite:category-ru': [77.88.8.8, 77.88.8.1]
    'rule-set:k4reon-ai-domains': 'https://1.1.1.1/dns-query#Ai'

# =======================
# SNIFFER
# =======================
# Позволяет применять доменные правила, когда приложение
# подключается по IP. Без него часть трафика уходит в MATCH.
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
  skip-domain:
    - '+.lan'
    - '+.local'
    - '+.apple.com'
    - '+.icloud.com'

# =======================
# ANCHORS
# =======================
anchors:
  a1: &domain { type: http, format: mrs, behavior: domain, interval: 43200 }
  a2: &ipcidr { type: http, format: mrs, behavior: ipcidr, interval: 43200 }
  a3: &classical { type: http, format: text, behavior: classical, interval: 43200 }

# =======================
# PROXY PROVIDERS
# =======================
# Подписка качается напрямую (proxy: DIRECT), чтобы не зависеть
# от самой прокси. Заменить url.
proxy-providers:
  main:
    type: http
    proxy: DIRECT
    url: "https://example.com/your-subscription"
    interval: 3600
    path: ./providers/main.yaml
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 600
      timeout: 5000
      expected-status: 204
      lazy: true

# =======================
# PROXY GROUPS
# =======================
# PROXY — fallback: первый живой из Fast/DIRECT.
# Fast — url-test: автоматически лучший узел.
# YouTube/Ai/Discord/Messengers — fallback по своим сервисам.
# Games — select с DIRECT по умолчанию (игры чаще лучше напрямую).
proxy-groups:
  - name: PROXY
    type: fallback
    proxies:
      - Fast
      - DIRECT
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    timeout: 5000
    lazy: true
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png

  - name: Fast
    type: url-test
    include-all: true
    #filter: "^(?!.*(🇷🇺)).*$"
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 50
    timeout: 5000
    lazy: true
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Rocket.png

  - name: YouTube
    type: fallback
    include-all: true
    #filter: "(?i)(🇫🇮|🇸🇪|🇳🇱|🇩🇪|🇨🇿)"
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    timeout: 5000
    lazy: true
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png

  - name: Ai
    type: fallback
    include-all: true
    #filter: "(?i)(🇭🇺|🇧🇬|🇵🇱|🇨🇿|🇩🇪|🇦🇹|🇳🇱)"
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    timeout: 5000
    lazy: true
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ChatGPT.png

  - name: Discord
    type: fallback
    include-all: true
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    timeout: 5000
    lazy: true
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Discord.png

  - name: Games
    type: select
    include-all: true
    proxies: [DIRECT]
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png

  - name: Messengers
    type: fallback
    include-all: true
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    timeout: 5000
    lazy: true
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram_X.png

  - name: GLOBAL
    type: select
    hidden: true
    proxies:
      - PROXY
      - DIRECT

# =======================
# RULE PROVIDERS
# =======================
# Все наборы k4reon-*; одна строка на провайдер.
rule-providers:
  k4reon-private-domains: { <<: *domain, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-private-domains.mrs }
  k4reon-private-ip: { <<: *ipcidr, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-private-ip.mrs }
  k4reon-ads-domains: { <<: *domain, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-ads-domains.mrs }
  k4reon-ru-domains: { <<: *domain, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-ru-domains.mrs }
  k4reon-ru-classical: { <<: *classical, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-ru-classical.txt }
  k4reon-torrent-domains: { <<: *domain, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-torrent-domains.mrs }
  k4reon-youtube-domains: { <<: *domain, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-youtube-domains.mrs }
  k4reon-youtube-ip: { <<: *ipcidr, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-youtube-ip.mrs }
  k4reon-games-domains: { <<: *domain, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-games-domains.mrs }
  k4reon-games-ip: { <<: *ipcidr, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-games-ip.mrs }
  k4reon-games-ports: { <<: *classical, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-games-ports.txt }
  k4reon-discord-domains: { <<: *domain, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-discord-domains.mrs }
  k4reon-discord-ip: { <<: *ipcidr, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-discord-ip.mrs }
  k4reon-discord-ports: { <<: *classical, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-discord-ports.txt }
  k4reon-ai-domains: { <<: *domain, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-ai-domains.mrs }
  k4reon-ai-ip: { <<: *ipcidr, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-ai-ip.mrs }
  k4reon-google-domains: { <<: *domain, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-google-domains.mrs }
  k4reon-google-ip: { <<: *ipcidr, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-google-ip.mrs }
  k4reon-messengers-domains: { <<: *domain, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-messengers-domains.mrs }
  k4reon-messengers-ip: { <<: *ipcidr, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-messengers-ip.mrs }
