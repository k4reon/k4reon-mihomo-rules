# ============================================================
#  k4reon — профиль DIRECT (в конце MATCH,DIRECT)
#  Лёгкий профиль: только то, что должно идти в прокси,
#  плюс блокировка рекламы. Всё остальное и так напрямую.
# ============================================================

rule-providers:
  k4reon-ads-domains: { type: http, format: mrs, behavior: domain, interval: 43200, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-ads-domains.mrs }
  k4reon-youtube-domains: { type: http, format: mrs, behavior: domain, interval: 43200, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-youtube-domains.mrs }
  k4reon-youtube-ip: { type: http, format: mrs, behavior: ipcidr, interval: 43200, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-youtube-ip.mrs }
  k4reon-games-domains: { type: http, format: mrs, behavior: domain, interval: 43200, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-games-domains.mrs }
  k4reon-games-ip: { type: http, format: mrs, behavior: ipcidr, interval: 43200, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-games-ip.mrs }
  k4reon-games-ports: { type: http, format: text, behavior: classical, interval: 43200, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-games-ports.txt }
  k4reon-discord-domains: { type: http, format: mrs, behavior: domain, interval: 43200, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-discord-domains.mrs }
  k4reon-discord-ip: { type: http, format: mrs, behavior: ipcidr, interval: 43200, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-discord-ip.mrs }
  k4reon-discord-ports: { type: http, format: text, behavior: classical, interval: 43200, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-discord-ports.txt }
  k4reon-ai-domains: { type: http, format: mrs, behavior: domain, interval: 43200, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-ai-domains.mrs }
  k4reon-ai-ip: { type: http, format: mrs, behavior: ipcidr, interval: 43200, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-ai-ip.mrs }
  k4reon-messengers-domains: { type: http, format: mrs, behavior: domain, interval: 43200, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-messengers-domains.mrs }
  k4reon-messengers-ip: { type: http, format: mrs, behavior: ipcidr, interval: 43200, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-messengers-ip.mrs }
  k4reon-social-domains: { type: http, format: mrs, behavior: domain, interval: 43200, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-social-domains.mrs }
  k4reon-social-ip: { type: http, format: mrs, behavior: ipcidr, interval: 43200, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-social-ip.mrs }
  k4reon-custom-proxy: { type: http, format: text, behavior: classical, interval: 43200, url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-custom-proxy.txt }

rules:
  # --- 1. Реклама ---
  - RULE-SET,k4reon-ads-domains,REJECT

  # --- 2. YouTube ---
  - RULE-SET,k4reon-youtube-domains,YouTube
  - RULE-SET,k4reon-youtube-ip,YouTube,no-resolve

  # --- 3. Игры ---
  - RULE-SET,k4reon-games-domains,Games
  - AND,((NETWORK,UDP),(RULE-SET,k4reon-games-ip)),Games
  - RULE-SET,k4reon-games-ports,Games

  # --- 4. Discord ---
  - RULE-SET,k4reon-discord-domains,Discord
  - RULE-SET,k4reon-discord-ip,Discord,no-resolve
  - RULE-SET,k4reon-discord-ports,Discord

  # --- 5. AI / Gemini / нейронки ---
  - RULE-SET,k4reon-ai-domains,Ai
  - RULE-SET,k4reon-ai-ip,Ai,no-resolve

  # --- 6. Мессенджеры ---
  - RULE-SET,k4reon-messengers-domains,Messengers
  - RULE-SET,k4reon-messengers-ip,Messengers,no-resolve

  # --- 7. Соцсети ---
  - RULE-SET,k4reon-social-domains,Fast
  - RULE-SET,k4reon-social-ip,Fast,no-resolve

  # --- 8. Кастомные домены в прокси ---
  - RULE-SET,k4reon-custom-proxy,PROXY

  # --- 9. Всё остальное напрямую ---
  - MATCH,DIRECT
