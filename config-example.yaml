# ============================================================
#  Example: how to plug k4reon rule-sets into mihomo
#  Place before GEOIP,RU and MATCH,PROXY.
# ============================================================

rule-providers:
  # --- local files (copy dist/* into /opt/clash/local-rules/) ---
  k4reon-games-domains:
    type: file
    behavior: domain
    format: mrs
    path: ./local-rules/k4reon-games-domains.mrs

  k4reon-games-ip:
    type: file
    behavior: ipcidr
    format: mrs
    path: ./local-rules/k4reon-games-ip.mrs

  k4reon-games-ports:
    type: file
    behavior: classical
    format: yaml
    path: ./local-rules/k4reon-games-ports.yaml

  k4reon-discord-domains:
    type: file
    behavior: domain
    format: mrs
    path: ./local-rules/k4reon-discord-domains.mrs

  k4reon-discord-ip:
    type: file
    behavior: ipcidr
    format: mrs
    path: ./local-rules/k4reon-discord-ip.mrs

  k4reon-discord-ports:
    type: file
    behavior: classical
    format: yaml
    path: ./local-rules/k4reon-discord-ports.yaml

  # --- via GitHub (replace USER/REPO) ---
  # k4reon-games-domains:
  #   type: http
  #   behavior: domain
  #   format: mrs
  #   url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-games-domains.mrs
  #   path: ./ruleset/k4reon-games-domains.mrs
  #   interval: 86400
  #
  # k4reon-games-ip:
  #   type: http
  #   behavior: ipcidr
  #   format: mrs
  #   url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-games-ip.mrs
  #   path: ./ruleset/k4reon-games-ip.mrs
  #   interval: 86400
  #
  # k4reon-games-ports:
  #   type: http
  #   behavior: classical
  #   format: yaml
  #   url: https://raw.githubusercontent.com/k4reon/k4reon-mihomo-rules/main/dist/k4reon-games-ports.yaml
  #   path: ./ruleset/k4reon-games-ports.yaml
  #   interval: 86400

rules:
  # ... existing rules ...

  # --- Games: k4reon custom additions ---
  - RULE-SET,k4reon-games-domains,Games
  - RULE-SET,k4reon-games-ip,Games
  - RULE-SET,k4reon-games-ports,Games

  # --- Discord: k4reon custom additions ---
  # (keep RULE-SET,discord@domain,Discord as well)
  - RULE-SET,k4reon-discord-domains,Discord
  - RULE-SET,k4reon-discord-ip,Discord
  - RULE-SET,k4reon-discord-ports,Discord

  # ... IPTV / GEOIP / MATCH ...
